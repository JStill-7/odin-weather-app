<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<body>
    <div id="container">
        <div id="flex-top-half">
            <form id="weather-form">
                <input id="city-search" type="text" placeholder="search city">
            </form>
            <div class="city-container">
                <p id="date-time">time / date</p>
                <h1 id="city">City</h1>
                <div id="temp-box">
                    <button id="celsius-btn">°C</button>
                    <h1 id="temp">80</h1>
                </div>
            </div>
        </div>
        <div class="flex-bottom-half">
            <div class="forecast-container">
                <div class="forecast-card">
                    <p class="forecast-day">mon</p>
                    <p class="forecast-temp">80</p>
                    <img class="forecast-icon" src="" alt="">
                </div>
                <div class="forecast-card">
                    <p class="forecast-day">mon</p>
                    <p class="forecast-temp">80</p>
                    <img class="forecast-icon" src="" alt="">
                </div>
                <div class="forecast-card">
                    <p class="forecast-day">mon</p>
                    <p class="forecast-temp">80</p>
                    <img class="forecast-icon" src="" alt="">
                </div>
                <div class="forecast-card">
                    <p class="forecast-day">mon</p>
                    <p class="forecast-temp">80</p>
                    <img class="forecast-icon" src="" alt="">
                </div>
                <div class="forecast-card">
                    <p class="forecast-day">mon</p>
                    <p class="forecast-temp">80</p>
                    <img class="forecast-icon" src="" alt="">
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
