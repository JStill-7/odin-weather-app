<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <title>Weather</title>
</head>
<body>
    <div id="container">
        <div id="flex-top-half">
            <form id="weather-form">
                <input id="city-search" type="text" placeholder="search city">
            </form>
            <div class="city-container">
                <p id="date-time">time / city</p>
                <h1 id="city">City</h1>
                <h1 id="temp">80</h1>
            </div>
        </div>
        <div class="flex-bottom-half">
            <div class="forecast-container">
                <div class="forecast-card">
                    <p>mon</p>
                    <p>80</p>
                </div>
                <div class="forecast-card">
                    <p>tues</p>
                    <p>80</p>
                </div>
                <div class="forecast-card">
                    <p>wends</p>
                    <p>80</p>
                </div>
                <div class="forecast-card">
                    <p>thurs</p>
                    <p>80</p>
                </div>
                <div class="forecast-card">
                    <p>fri</p>
                    <p>80</p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
