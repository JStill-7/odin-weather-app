<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<body>
    <div id="container">
        <div id="flex-top-half">
            <form id="weather-form">
                <input id="city-search" type="text" placeholder="search city">
            </form>
            <div class="city-container">

                <div id="empty-state">
                    <p>YOUR WEATHER, AT A GLANCE</p>
                    <h1>Find your forecast</h1>
                    <p>
                    Search for a city above to see current weather
                    conditions and your five-day forecast.
                    </p>
                </div>
                <div id="weather-content" hidden>
                    <p id="date-time">time / date</p>
                    <h1 id="city">City</h1>
                    <div id="temp-box">
                        <img id="current-icon" src="">
                        <button id="celsius-btn">°C</button>
                        <h1 id="temp">80</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex-bottom-half">
        <div class="forecast-container" id="forecast-section" hidden>
            <div class="forecast-card">
                <p class="forecast-day">mon</p>
                <p class="forecast-temp">80</p>
                <img class="forecast-icon" src="" alt="">
            </div>
            <div class="forecast-card">
                <p class="forecast-day">mon</p>
                <p class="forecast-temp">80</p>
                <img class="forecast-icon" src="" alt="">
            </div>
            <div class="forecast-card">
                <p class="forecast-day">mon</p>
                <p class="forecast-temp">80</p>
                <img class="forecast-icon" src="" alt="">
            </div>
            <div class="forecast-card">
                <p class="forecast-day">mon</p>
                <p class="forecast-temp">80</p>
                <img class="forecast-icon" src="" alt="">
            </div>
            <div class="forecast-card">
                <p class="forecast-day">mon</p>
                <p class="forecast-temp">80</p>
                <img class="forecast-icon" src="" alt="">
            </div>
        </div>
    </div>
    </div>
    
</body>
</html>
